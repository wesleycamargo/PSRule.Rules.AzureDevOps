name: PSRule Azure DevOps Assessment

trigger: none
pr: none

schedules:
  - cron: "0 2 * * 0"
    displayName: Weekly PSRule assessment
    branches:
      include:
        - main
        - automation/psrule-assessment
    always: true

variables:
  - group: ai-credentials
  - name: ADO_ORGANIZATION
    value: "ai-experiments"
  - name: ADO_ORGANIZATION_ID
    value: "3b022c28-683d-4d7e-87a5-bd8198332011"
  - name: ADO_TENANT_ID
    value: $[ variables['Directory (tenant) ID'] ]
  - name: ADO_CLIENT_ID
    value: $[ variables['Application (client) ID'] ]
  - name: ADO_CLIENT_SECRET
    value: $[ variables['secret'] ]
  - name: PSRULE_VERSION
    value: "2.9.0"

pool:
  name: AI-Pool

steps:
  - checkout: self

  - task: PowerShell@2
    displayName: Install PSRule
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $psRule = Get-Module -ListAvailable -Name PSRule |
            Where-Object { $_.Version -eq [version]$env:PSRULE_VERSION } |
            Select-Object -First 1

        if ($null -eq $psRule) {
            Install-Module -Name PSRule `
                -RequiredVersion $env:PSRULE_VERSION `
                -Scope CurrentUser `
                -Force `
                -SkipPublisherCheck
        }
    env:
      PSRULE_VERSION: $(PSRULE_VERSION)

  - task: PowerShell@2
    displayName: Export and assess Azure DevOps organization
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $exportPath = Join-Path $env:PIPELINE_WORKSPACE 'psrule-export'
        $reportPath = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'psrule-results.sarif'

        New-Item -Path $exportPath -ItemType Directory -Force | Out-Null
        $moduleManifest = Join-Path $env:BUILD_SOURCESDIRECTORY 'src/PSRule.Rules.AzureDevOps/PSRule.Rules.AzureDevOps.psd1'
        Import-Module $moduleManifest -Force

        $tokenBody = @{
            grant_type = 'client_credentials'
            client_id = $env:ADO_CLIENT_ID
            client_secret = $env:ADO_CLIENT_SECRET
            scope = '499b84ac-1321-427f-aa17-267ca6975798/.default'
        }
        $accessToken = (Invoke-RestMethod `
            -Uri "https://login.microsoftonline.com/$($env:ADO_TENANT_ID)/oauth2/v2.0/token" `
            -Method Post `
            -Body $tokenBody `
            -ContentType 'application/x-www-form-urlencoded').access_token

        $connectParams = @{
            Organization = $env:ADO_ORGANIZATION
            OrganizationId = $env:ADO_ORGANIZATION_ID
            AccessToken = $accessToken
        }
        Connect-AzDevOps @connectParams
        Export-AzDevOpsOrganizationRuleData `
            -Organization $env:ADO_ORGANIZATION `
            -OrganizationId $env:ADO_ORGANIZATION_ID `
            -OutputPath $exportPath

        $null = Assert-PSRule `
            -InputPath $exportPath `
            -Module PSRule.Rules.AzureDevOps `
            -Baseline Baseline.Default `
            -OutputPath $reportPath `
            -OutputFormat Sarif `
            -ResultVariable results
        $failedCount = @($results | Where-Object { $_.Outcome -eq 'Fail' }).Count

        Write-Host "PSRule assessment completed with $failedCount failed rule result(s)."
        Write-Host "##vso[task.setvariable variable=PSRuleFailedCount]$failedCount"
    env:
      ADO_ORGANIZATION: $(ADO_ORGANIZATION)
      ADO_ORGANIZATION_ID: $(ADO_ORGANIZATION_ID)
      ADO_TENANT_ID: $(ADO_TENANT_ID)
      ADO_CLIENT_ID: $(ADO_CLIENT_ID)
      ADO_CLIENT_SECRET: $(ADO_CLIENT_SECRET)

  - task: PublishBuildArtifacts@1
    displayName: Publish PSRule SARIF report
    condition: always()
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)
      ArtifactName: psrule-results
      publishLocation: Container
