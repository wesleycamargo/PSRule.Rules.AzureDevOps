# GitHub workflow for running pester unit tests on pull requests

on: 
  pull_request:
    paths:
      - 'src/PSRule.Rules.AzureDevOps/**'
      - 'pipelines/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
    branches:
      - main
  push:
    paths:
      - 'src/PSRule.Rules.AzureDevOps/**'
      - 'pipelines/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
    branches:
      - main

name: PS Module CI

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  run-pester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSRule and Pester
        run: |
          (Import-PowerShellDataFile ./tests/requirements.psd1).GetEnumerator() | ForEach-Object {
            Install-Module $_.Key -RequiredVersion $_.Value -Scope CurrentUser -Force -SkipPublisherCheck
          }
        shell: pwsh

      # Temporarily disabled until PSScriptAnalyzer is updated to support PowerShell 7
      # - name: Run PSScriptAnalyzer
      #   run: |
      #     Invoke-ScriptAnalyzer -Path .\src -Recurse -Verbose
      #   shell: pwsh

      - name: Run Pester Tests
        run: |
          ./tests/Run-Tests.ps1 -TestType Unit -Coverage
        shell: pwsh

      - name: Upload Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        with:
          files: |
            **/testresults.xml

      - name: Retain validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-validation
          path: |
            testresults.xml
            coverage.xml

      - name: Upload Code Coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
